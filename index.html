<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <title>pongbot</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
  </head>
  <body>
    <script>
      // Set to true to show the debug panel (speed, bounce noise, AI targets).
      window.DEV = false;
      window.LEFT_AI = 'human';
      window.RIGHT_AI = 'fun';
    </script>

    <div id="menu">
      <div class="panel">
        <h1>PONGBOT</h1>
        <p class="sub">Smid filen i ai/</p>

        <label>
          Left (W / S)
          <select id="left-ai"></select>
        </label>
        <label>
          Right (↑ / ↓)
          <select id="right-ai"></select>
        </label>
        <label>
          Best of
          <select id="best-of">
            <option value="1">1 (single point)</option>
            <option value="3">3</option>
            <option value="5" selected>5</option>
            <option value="7">7</option>
            <option value="9">9</option>
            <option value="11">11</option>
          </select>
        </label>

        <button id="btn-start" type="button">Start match</button>
      </div>
    </div>

    <button id="btn-menu" type="button" hidden>Menu</button>

    <div id="match-over" hidden>
      <div class="panel">
        <h2 id="winner-text">Match over</h2>
        <p id="final-score" class="sub"></p>
        <button id="btn-again" type="button">Play again</button>
        <button id="btn-back" type="button">Menu</button>
      </div>
    </div>

    <aside id="dev-panel" hidden>
      <div class="dev-title">DEV</div>
      <pre id="dev-body"></pre>
    </aside>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.10.0/p5.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/debug.js"></script>
    <script src="js/registry.js"></script>
    <script src="js/ai-util.js"></script>
    <script src="ai/_files.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
